<!DOCTYPE html><html><head><meta charset="utf-8"><title>Checkout - Test Shop</title>
<style>body{font-family:system-ui;margin:0;background:#f4f4f6}header{background:#fff;padding:16px 32px;border-bottom:1px solid #ddd;font-weight:700}main{max-width:900px;margin:30px auto;display:grid;grid-template-columns:1.4fr 1fr;gap:24px}
.box{background:#fff;border:1px solid #ddd;border-radius:8px;padding:20px}.item{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid #eee}input{padding:10px;border:1px solid #ccc;border-radius:6px;width:60%}button{padding:10px 16px;border:0;border-radius:6px;background:#111;color:#fff}.total{font-size:1.4rem;font-weight:800}.err{color:#b00020;font-size:.9rem;min-height:1.2em}.tag{display:inline-block;background:#e8f5e9;padding:4px 8px;border-radius:6px;margin-top:8px}</style></head>
<body><header>Test Shop · Checkout</header><main>
<div class="box"><h2>Your order</h2><div class="item"><span>Kobra X 3D printer</span><span>€299.00</span></div><div class="item"><span>Shipping</span><span>€0.00</span></div>
<h3>Discount code</h3><form id="f"><input id="discount" name="discount" placeholder="Gift card or discount code" autocomplete="off"> <button type="submit" id="apply">Apply</button></form>
<div class="err" id="err"></div><div id="applied"></div></div>
<div class="box"><h2>Summary</h2><div class="item"><span>Subtotal</span><span>€299.00</span></div><div class="item"><span>Total</span><span class="total" id="total">€299.00</span></div><button style="width:100%;margin-top:16px">Pay now</button></div>
</main>
<script>
const BASE=299, CODES={TEST10:.10, SAVED20:.20, FLAT5:null};
let current=null; window.__log=[];
function render(){ let t=BASE; if(current==='FLAT5') t=BASE-5; else if(current && CODES[current]) t=BASE*(1-CODES[current]);
  document.getElementById('total').textContent='€'+t.toFixed(2);
  document.getElementById('applied').innerHTML=current?`<span class="tag">${current} applied <button type="button" id="rm">Remove ${current}</button></span>`:'';
  if(current) document.getElementById('rm').onclick=()=>{ window.__log.push('remove:'+current); current=null; setTimeout(render,250); }; }
document.getElementById('f').addEventListener('submit',e=>{ e.preventDefault(); const v=document.getElementById('discount').value.trim().toUpperCase(); window.__log.push('try:'+v+':'+Date.now());
  document.getElementById('err').textContent='';
  setTimeout(()=>{ if(v in CODES){ current=v; render(); } else { document.getElementById('err').textContent='This code is invalid.'; } }, 300); });
render();
</script></body></html>
